name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build frontend
        run: npm run build

      # tests/e2e/harness.mjs hardcodes a local chromium cache path
      # (~/.cache/ms-playwright/chromium-1228/...) and only uses it when it
      # exists on disk, otherwise falling back to Playwright's own resolved
      # browser (executablePath: undefined) — so a plain `install` here is
      # all CI needs, no path-matching required.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Backed by sample-photos/ (bundled CC0 photos) — see sample-photos/CREDITS.md.
      # destinationMode stays on "Export Folder" throughout the suite, so any
      # output from these servers only ever lands in the gitignored
      # sample-photos-blurred/ folder, never overwriting the tracked source images.
      - name: Start backend and frontend
        run: |
          node server.js > /tmp/blur-studio-server.log 2>&1 &
          npx vite --port 5173 > /tmp/blur-studio-vite.log 2>&1 &

      - name: Wait for backend and frontend to be ready
        run: |
          echo "Waiting for backend on http://localhost:3333 ..."
          timeout 60 bash -c 'until curl -sf http://localhost:3333/api/presets > /dev/null; do sleep 1; done'
          echo "Backend is up."

          echo "Waiting for frontend on http://localhost:5173 ..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 1; done'
          echo "Frontend is up."

      - name: Run E2E tests
        env:
          # harness.mjs defaults to http://localhost:5178; we started vite on
          # the port vite.config.js actually configures (5173), so point the
          # suite at that explicitly.
          BLUR_STUDIO_URL: http://localhost:5173
        run: npm run test:e2e

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- server.js log ---"
          cat /tmp/blur-studio-server.log || true
          echo "--- vite log ---"
          cat /tmp/blur-studio-vite.log || true

      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
